<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Free Account &bull; ResumeRadar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container container-auth">
        <div class="card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2>Create Your Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Private, on-device ATS resume verification</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Alex Learner" required>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: var(--danger); font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="alex@example.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--danger); font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--danger); font-size: 0.8125rem; margin-top: 0.25rem;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Account Role</label>
                    <select id="role" th:field="*{role}" class="form-control">
                        <option value="USER">Student / Job Seeker</option>
                        <option value="MENTOR">Mentor / Placement Guide</option>
                    </select>
                    <div class="form-hint">Mentors can review linked student score curves and post feedback.</div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Create Account</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Already registered? <a th:href="@{/login}">Sign in here</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
