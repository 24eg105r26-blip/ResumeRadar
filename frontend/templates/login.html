<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; ResumeRadar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container container-auth">
        <div class="card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2>Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to inspect your resume and score trends</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label" for="username">Email Address</label>
                    <input type="email" id="username" name="username" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Don't have an account? <a th:href="@{/register}">Sign up free</a>
            </div>

            <!-- Demo helper cards -->
            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle);">
                <div style="font-size: 0.8125rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.5rem;">
                    Quick Demo Credentials:
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.8125rem;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillCreds('student@resumeradar.com', 'Password123!')" style="justify-content: flex-start;">
                        👤 Student: student@resumeradar.com
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillCreds('mentor@resumeradar.com', 'Password123!')" style="justify-content: flex-start;">
                        🧑‍🏫 Mentor: mentor@resumeradar.com
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillCreds('admin@resumeradar.com', 'AdminPassword123!')" style="justify-content: flex-start;">
                        🛡️ Admin: admin@resumeradar.com
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
