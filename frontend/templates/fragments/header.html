<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">ResumeRadar — On-Device ATS Resume Checker</title>
    
    <!-- Spring Security CSRF Meta Tags for on-device fetch() calls -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    
    <!-- Hand-written Vanilla CSS Light Theme -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- Local Vendor Scripts for On-Device Processing -->
    <script th:src="@{/vendor/pdf.min.js}"></script>
    <script th:src="@{/vendor/mammoth.browser.min.js}"></script>
    <script th:src="@{/js/resumeradar.js}"></script>
</head>
<body>
<nav class="navbar" th:fragment="navbar">
    <div class="container navbar-inner">
        <a th:href="@{/}" class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
            </svg>
            <span>ResumeRadar</span>
        </a>

        <ul class="nav-links">
            <li><a th:href="@{/guides/ats-friendly-formatting}">ATS Guide</a></li>
            <li><a th:href="@{/guides/resume-writing-tips}">Writing Tips</a></li>

            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/dashboard}">Dashboard</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/resumes}">My Resumes</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/jobs}">Job Descriptions</a>
            </li>
            <li sec:authorize="hasAnyRole('MENTOR', 'ADMIN')">
                <a th:href="@{/mentor/dashboard}">Mentor Hub</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin}">Admin</a>
            </li>
        </ul>

        <div class="nav-user">
            <div sec:authorize="isAnonymous()" style="display: flex; gap: 0.5rem;">
                <a th:href="@{/login}" class="btn btn-outline btn-sm">Log In</a>
                <a th:href="@{/register}" class="btn btn-primary btn-sm">Sign Up Free</a>
            </div>

            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 0.75rem;">
                <span class="user-badge">
                    <span sec:authentication="name">User</span>
                </span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
