spring.application.name=ResumeRadar
server.port=8080

# Database Configuration (MySQL)
# Default placeholders; override with environment variables or adjust username/password as needed
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resumeradar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Srinithya@9838}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Configuration
server.servlet.session.timeout=60m

# Seed initial demo accounts if not already present
resumeradar.seed.data=true
