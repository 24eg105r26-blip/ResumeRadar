<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Job Description' : 'Add New Job Description'}">Target Job &bull; ResumeRadar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/resumeradar.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container container-narrow" style="padding-top: 2rem; padding-bottom: 4rem;">
        <div class="card">
            <div style="margin-bottom: 1.5rem;">
                <a th:href="@{/jobs}" style="font-size: 0.875rem; color: var(--text-muted);">&larr; Back to Job Descriptions</a>
                <h2 th:text="${isEdit ? 'Edit Job Description' : 'Add Target Job Description'}" style="margin-top: 0.25rem;">Job Description</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Paste the job description text. Our on-device skills matcher will automatically identify key competencies.
                </p>
            </div>

            <form th:action="@{/jobs/save}" th:object="${jobDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="form-group">
                    <label class="form-label" for="title">Position / Job Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Full Stack Java Engineer" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="text">Full Job Description Text</label>
                    <textarea id="text" th:field="*{text}" class="form-control" style="min-height: 220px;" 
                              placeholder="Paste requirements, responsibilities, and qualifications..." 
                              oninput="autoDetectSkills(this.value)" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="extractedSkills">Extracted Technical Skills</label>
                    <input type="text" id="extractedSkills" th:field="*{extractedSkills}" class="form-control" 
                           placeholder="e.g. java, spring boot, mysql, git, docker">
                    <div class="form-hint">Automatically updated as you paste text above. You can also edit manually.</div>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Save Job Description</button>
                    <a th:href="@{/jobs}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function autoDetectSkills(text) {
            if (window.ResumeRadar) {
                const skills = ResumeRadar.extractSkillsFromJobDescription(text);
                document.getElementById('extractedSkills').value = skills.join(', ');
            }
        }
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
