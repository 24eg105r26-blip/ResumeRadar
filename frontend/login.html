<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ResumeRadar</title>
</head>
<body>
    <main class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
        <div class="card" style="width: 100%; max-width: 420px;">
            <div style="text-align: center; margin-bottom: 1.25rem;">
                <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">ResumeRadar</h1>
                <p id="formSubtitle" style="color: var(--text-muted); font-size: 0.9375rem;">Login to open your Resume Health Dashboard</p>
            </div>

            <div id="statusAlert" class="alert" style="display: none; margin-bottom: 1rem;"></div>

            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 0.5rem;">Login</button>
            </form>

            <p style="text-align: center; font-size: 0.875rem; margin-top: 1rem; color: var(--text-muted);">
                <span id="toggleText">New here?</span>
                <a href="#" id="toggleLink" style="font-weight: 600;">Create an account</a>
            </p>
        </div>
    </main>

    <script type="module" src="/src/login.js"></script>
</body>
</html>
